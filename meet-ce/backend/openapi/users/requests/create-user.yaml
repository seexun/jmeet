description: User creation options
required: true
content:
    application/json:
        schema:
            type: object
            properties:
                loginName:
                    type: string
                    pattern: '^[a-zA-Z0-9._-]+$'
                    example: 'alice.smith'
                    description: |
                        The unique login account. The immutable user ID is generated by the server.
                name:
                    type: string
                    maxLength: 50
                    example: 'Alice Smith'
                    description: |
                        The display name (profile name) for the user.
                email:
                    type: string
                    format: email
                employeeNumber:
                    type: string
                role:
                    type: string
                    enum: ['admin', 'room_manager', 'room_member']
                    example: 'room_manager'
                    description: |
                        The role to assign to the user. Available roles:
                        - admin: Has full control over the entire application (configuration, users, rooms, etc).
                        - room_manager: Can create and manage their own created rooms. Can also access rooms they are a member of, but without management permissions.
                        - room_member: Can only access rooms they are a member of, without ability to create or manage rooms.
                password:
                    type: string
                    format: password
                    minLength: 5
                    example: 'SecureP@ssw0rd'
                    description: |
                        The password for the new user account.
            required:
                - loginName
                - name
                - role
                - password
