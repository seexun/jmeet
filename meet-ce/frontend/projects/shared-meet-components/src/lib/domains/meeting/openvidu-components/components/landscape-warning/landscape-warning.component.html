<!-- Landscape orientation warning for mobile devices -->
<div id="landscape-warning" [animate.enter]="'ov-fade-in-200'" [animate.leave]="'ov-fade-out-200'">
	<div class="warning-message">
		<nz-icon nzType="rotate-right" class="warning-icon" />
		<span>{{ 'ROOM.LANDSCAPE_WARNING' | translate }}</span>
	</div>
</div>
