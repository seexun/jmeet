/rooms/{roomId}/schedule:
    put:
        operationId: updateMeetingSchedule
        summary: Schedule or reschedule a meeting
        description: Updates the schedule of a room. An active meeting cannot be rescheduled.
        tags:
            - JMeet - Rooms
        security:
            - apiKeyHeader: []
            - accessTokenHeader: []
        parameters:
            - $ref: './parameters/room-id-path.yaml'
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        additionalProperties: false
                        required: [startDate, durationMinutes, timezone, recurrence, allowEarlyJoinMinutes]
                        properties:
                            startDate:
                                type: integer
                                format: int64
                                description: Meeting start time as Unix epoch milliseconds.
                                example: 1786586400000
                            durationMinutes:
                                type: integer
                                minimum: 1
                                maximum: 10080
                                example: 60
                            timezone:
                                type: string
                                maxLength: 100
                                example: Asia/Shanghai
                            recurrence:
                                type: string
                                enum: [none, daily, weekly]
                                example: none
                            allowEarlyJoinMinutes:
                                type: integer
                                minimum: 0
                                maximum: 1440
                                example: 10
        responses:
            '200':
                description: Meeting schedule updated successfully.
                content:
                    application/json:
                        schema:
                            $ref: './schemas/meet-room.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../shared/responses/errors/forbidden.yaml'
            '404':
                $ref: './responses/errors/room-not-found.yaml'
            '409':
                description: The room has an active meeting and cannot be rescheduled.
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
/rooms/{roomId}/cancel:
    post:
        operationId: cancelMeeting
        summary: Cancel a meeting
        description: Cancels a scheduled meeting, closes the room, and invalidates its anonymous access links.
        tags:
            - JMeet - Rooms
        security:
            - apiKeyHeader: []
            - accessTokenHeader: []
        parameters:
            - $ref: './parameters/room-id-path.yaml'
        requestBody:
            required: false
            content:
                application/json:
                    schema:
                        type: object
                        additionalProperties: false
                        properties:
                            reason:
                                type: string
                                maxLength: 500
                                description: Optional cancellation reason included in participant notifications.
                                example: Schedule changed
        responses:
            '200':
                description: Meeting cancelled successfully.
                content:
                    application/json:
                        schema:
                            $ref: './schemas/meet-room.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../shared/responses/errors/forbidden.yaml'
            '404':
                $ref: './responses/errors/room-not-found.yaml'
            '409':
                description: The room has an active meeting; end the active meeting instead.
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
