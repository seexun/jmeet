<div class="dialog-container">
	<h2 class="dialog-title">
		<nz-icon nzType="key" class="dialog-icon" />
		{{ 'USERS.RESET_PASSWORD_DIALOG.TITLE' | translate }}
	</h2>

	<p class="dialog-subtitle">
		{{ 'USERS.RESET_PASSWORD_DIALOG.SUBTITLE' | translate }}
		<strong>{{ data.user.name }}</strong>
		<span class="user-id-hint">({{ data.user.loginName }})</span>
	</p>

	<div class="jmeet-form-item">
		<p class="jmeet-form-label">{{ 'USERS.COMMON.TEMPORARY_PASSWORD' | translate }}</p>
		<div class="reset-password-dialog__password-row">
			<input
				nz-input
				[ngModel]="password()"
				(ngModelChange)="password.set($event)"
				[type]="showPassword() ? 'text' : 'password'"
				[placeholder]="'USERS.RESET_PASSWORD_DIALOG.PASSWORD_PLACEHOLDER' | translate"
			/>
			<button class="jmeet-button jmeet-button--outline jmeet-button--sm" type="button" (click)="generatePassword()">
				{{ 'USERS.COMMON.AUTO_GENERATE' | translate }}
			</button>
			<button
				class="jmeet-button jmeet-button--ghost jmeet-button--icon"
				type="button"
				(click)="copyToClipboard()"
				nz-tooltip
				[nzTooltipTitle]="copied() ? ('USERS.COMMON.COPIED' | translate) : ('USERS.COMMON.COPY_TO_CLIPBOARD' | translate)"
			>
				<nz-icon [nzType]="(copied() ? 'check' : 'content_copy') | nzIconType" />
			</button>
			<button
				class="jmeet-button jmeet-button--ghost jmeet-button--icon"
				type="button"
				(click)="showPassword.set(!showPassword())"
				nz-tooltip
				[nzTooltipTitle]="showPassword() ? ('USERS.COMMON.HIDE_PASSWORD' | translate) : ('USERS.COMMON.SHOW_PASSWORD' | translate)"
			>
				<nz-icon [nzType]="(showPassword() ? 'visibility_off' : 'visibility') | nzIconType" />
			</button>
		</div>
	</div>

	<div class="info-banner operations-hint">
		<nz-icon nzType="info-circle" class="info-icon" />
		<p class="jmeet-text--body-secondary">{{ 'USERS.RESET_PASSWORD_DIALOG.INFO_BANNER' | translate }}</p>
	</div>

	<div class="jmeet-form-actions dialog-actions">
		<button class="jmeet-button jmeet-button--outline" type="button" (click)="cancel()">{{ 'USERS.COMMON.CANCEL' | translate }}</button>
		<button
			class="jmeet-button jmeet-button--primary"
			type="button"
			[disabled]="!password() || isSaving()"
			(click)="confirm()"
			>
			@if (isSaving()) {
				<nz-spin nzSimple nzSize="small" class="reset-password-dialog__spinner" />
			} @else {
				{{ 'USERS.RESET_PASSWORD_DIALOG.TITLE' | translate }}
			}
		</button>
	</div>
</div>
